version: 1
backend:
  phases:
    build:
      commands:
        # Deploy the Amplify Gen 2 backend (the Square payment function).
        # Soft-fails so the frontend still deploys if backend builds aren't yet
        # enabled in the Amplify console (service role + secrets). Once enabled,
        # this provisions the function and writes amplify_outputs.json.
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID || echo "Backend deploy skipped/failed — see SQUARE_SETUP.md to enable."
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
